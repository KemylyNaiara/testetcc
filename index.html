<!DOCTYPE html>
<html lang="pt-br">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <meta content="light" name="color-scheme"/>
  <title>
   iPet - Cadastro
  </title>
  <link href="style.css" rel="stylesheet"/>
 </head>
 <body>
  <div class="tela" id="splash">
   <div class="circle">
    <img alt="Logo iPet" class="logo" src="logo.png"/>
   </div>
  </div>
  <div class="container tela" id="cadastro">
   <h2>
    Criar Conta
   </h2>
   <p>
    Preencha seus dados para começar
   </p>
   <form action="#" autocomplete="on" id="form-cadastro" method="GET">
    <div class="form-group">
     <label for="nome">
      Nome completo
     </label>
     <input autocomplete="name" id="nome" name="nome" placeholder="Digite seu nome" required="" type="text"/>
    </div>
    <div class="form-group">
     <label for="email">
      Gmail
     </label>
     <input autocomplete="email" id="email" name="email" placeholder="seu.email@gmail.com" required="" type="email"/>
    </div>
    <div class="form-group">
     <label for="senha">
      Senha
     </label>
     <input autocomplete="new-password" id="senha" name="senha" placeholder="Digite sua senha" required="" type="password"/>
     <div class="password-strength" id="password-strength">
     </div>
    </div>
    <div class="form-group">
     <label for="celular">
      Número de celular
     </label>
     <input autocomplete="tel" id="celular" name="celular" placeholder="(11) 99999-9999" required="" type="text"/>
    </div>
    <button class="btn btn-primary" type="submit">
     Próximo
    </button>
   </form>
   <div class="divider">
    <span>
     ou
    </span>
   </div>
   <a class="btn-google" href="#" id="link-google-login">
    Cadastrar-se com o Google
   </a>
  </div>
  <div class="container tela" id="login-google">
   <h2>
    Login com Google
   </h2>
   <form action="#" id="form-login-google" method="GET">
    <div class="form-group">
     <label for="login-email">
      Gmail
     </label>
     <input id="login-email" placeholder="seu.email@gmail.com" required="" type="email"/>
    </div>
    <div class="form-group">
     <label for="login-senha">
      Senha
     </label>
     <input id="login-senha" placeholder="Digite sua senha" required="" type="password"/>
    </div>
    <button class="btn btn-primary" type="submit">
     Entrar
    </button>
    <a href="#" id="link-redefinir-senha">
     Esqueci minha senha
    </a>
   </form>
   <a href="#" id="link-voltar-cadastro" style="text-align: center; margin-top: 20px;">
    ← Voltar para Cadastro
   </a>
  </div>
  <div class="container tela" id="redefinir-senha">
   <h2>
    Redefinir Senha
   </h2>
   <form action="#" id="form-redefinir-senha" method="GET">
    <div class="form-group">
     <label for="nova-senha">
      Nova Senha
     </label>
     <input id="nova-senha" placeholder="Digite a nova senha" required="" type="password"/>
    </div>
    <div class="form-group">
     <label for="repetir-senha">
      Repetir Senha
     </label>
     <input id="repetir-senha" placeholder="Repita a nova senha" required="" type="password"/>
    </div>
    <button class="btn btn-primary" type="submit">
     Continuar
    </button>
   </form>
   <a href="#" id="link-voltar-login" style="text-align: center; margin-top: 20px;">
    ← Voltar para Login
   </a>
  </div>
  <div class="tela" id="home">
   <div class="app-container">
    <input class="search" placeholder="Pesquise aqui..." type="text"/>
    <p class="subtitle">
     Encontre o que você precisa aqui.
    </p>
    <ul class="lista">
     <li>
      🐾 Veterinário
     </li>
     <li>
      🐾 Aviário
     </li>
     <li>
      🐾 Banho e Tosa
     </li>
     <li>
      🐾 Táxi Pet
     </li>
     <li>
      🐾 Pet Friendly
     </li>
    </ul>
    <div class="navbar">
     <button id="nav-back">
      ⬅️
     </button>
     <button id="nav-menu">
      ☰
     </button>
     <button id="nav-profile">
      👤
     </button>
    </div>
   </div>
  </div>
  <script defer="defer" src="script.js">
  </script>
 </body>
</html>
